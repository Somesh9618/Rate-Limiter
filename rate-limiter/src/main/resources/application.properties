spring.application.name=rate-limiter

# Redis
spring.data.redis.host = localhost
spring.data.redis.port = 6379

#selected algorithm for rate limiting, possible values: SLIDING_WINDOW, LEAKY_BUCKET, TOKEN_BUCKET
rate-limiter.algorithm = TOKEN_BUCKET

#shared capacity
rate-limiter.capacity=5

#used by fixed window and sliding window algorithms
rate-limiter.window-seconds=60

#used by leaky bucket and token bucket algorithms
rate-limiter.refill-tokens-per-second=1.0

#local demo api keys, comma separated
rate-limiter.demo-api-keys=demo-client-1,demo-client-2