spring.application.name=rate-limiter

spring.data.redis.host = localhost
spring.data.redis.port = 6379

spring.application.name=rate-limiter
rate-limiter.algorithm=FIXED_WINDOW
rate-limiter.capacity=5
rate-limiter.window-seconds=60
rate-limiter.refill-tokens-per-second=1.0

rate-limiter.demo-api-keys=demo-client-1,demo-client-2